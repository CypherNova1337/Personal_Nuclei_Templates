id: terraform-state-exposure

info:
  name: Terraform State File Exposure
  author: CypherNova1337
  severity: high
  description: |
    Detects an exposed Terraform state file (terraform.tfstate). State files
    store resource attributes in cleartext, routinely including database
    passwords, private keys, access tokens and other provider secrets.
  reference:
    - https://developer.hashicorp.com/terraform/language/state/sensitive-data
  remediation: |
    Store state in a secured remote backend (with access control and
    encryption) and never expose it over HTTP.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-538
  metadata:
    max-request: 4
  tags: exposure,terraform,iac,secret,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/terraform.tfstate"
      - "{{BaseURL}}/terraform.tfstate.backup"
      - "{{BaseURL}}/.terraform/terraform.tfstate"
      - "{{BaseURL}}/state/terraform.tfstate"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"terraform_version"'
          - '"lineage"'
          - '"resources"'
        condition: and

      - type: word
        part: header
        words:
          - "application/json"
          - "text/plain"
          - "application/octet-stream"
        condition: or

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: terraform_version
        group: 1
        regex:
          - '"terraform_version"\\s*:\\s*"([^"]+)"'
