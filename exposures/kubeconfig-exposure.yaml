id: kubeconfig-exposure

info:
  name: Kubernetes kubeconfig Exposure
  author: CypherNova1337
  severity: high
  description: |
    Detects an exposed Kubernetes kubeconfig file. It contains cluster API
    endpoints and embedded client certificates or tokens that can grant direct
    control of the cluster.
  reference:
    - https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
  remediation: Never expose kubeconfig files over HTTP; rotate any leaked credentials.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-538
  metadata:
    max-request: 4
  tags: exposure,kubernetes,kubeconfig,secret,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/.kube/config"
      - "{{BaseURL}}/kube/config"
      - "{{BaseURL}}/.kubeconfig"
      - "{{BaseURL}}/config"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "apiVersion:"
          - "clusters:"
          - "contexts:"
          - "current-context:"
        condition: and

      - type: word
        part: body
        words:
          - "kind: Config"
          - "client-certificate-data"
          - "server:"
        condition: or

      - type: status
        status:
          - 200
