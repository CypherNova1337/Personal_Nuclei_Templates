id: phpinfo-exposure

info:
  name: PHPInfo Page Exposure
  author: CypherNova1337
  severity: low
  description: |
    Detects an exposed phpinfo() page. These pages disclose the full PHP
    configuration, loaded modules, environment variables, absolute paths and
    sometimes secrets, greatly aiding further attacks.
  reference:
    - https://www.php.net/manual/en/function.phpinfo.php
    - https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/01-Information_Gathering/
  remediation: Remove phpinfo() pages from production and disable expose_php.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 5.3
    cwe-id: CWE-200
  metadata:
    max-request: 6
  tags: exposure,phpinfo,config,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/phpinfo.php"
      - "{{BaseURL}}/info.php"
      - "{{BaseURL}}/php_info.php"
      - "{{BaseURL}}/test.php"
      - "{{BaseURL}}/i.php"
      - "{{BaseURL}}/pi.php"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      # Signature strings emitted only by the phpinfo() output table.
      - type: word
        part: body
        words:
          - "PHP Version"
          - "Configuration"
          - '<title>phpinfo()'
        condition: and

      - type: word
        part: body
        words:
          - "phpinfo()"

      - type: status
        status:
          - 200

    extractors:
      - type: regex
        part: body
        name: php_version
        group: 1
        regex:
          - "PHP Version </td><td[^>]*>([0-9.]+)"
