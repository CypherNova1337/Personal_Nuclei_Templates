id: aws-credentials-file-exposure

info:
  name: AWS Credentials File Exposure
  author: CypherNova1337
  severity: high
  description: |
    Detects an exposed AWS shared credentials file (~/.aws/credentials). It
    contains long-lived access key IDs and secret access keys that grant API
    access to the account.
  reference:
    - https://docs.aws.amazon.com/cli/latest/userguide/cli-configure-files.html
  remediation: Remove the file from the web root and rotate the exposed keys.
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 8.6
    cwe-id: CWE-538
  metadata:
    max-request: 3
  tags: exposure,aws,credentials,secret,disclosure

http:
  - method: GET
    path:
      - "{{BaseURL}}/.aws/credentials"
      - "{{BaseURL}}/aws/credentials"
      - "{{BaseURL}}/credentials"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "aws_access_key_id"
          - "aws_secret_access_key"
        condition: and

      - type: regex
        part: body
        regex:
          - "aws_access_key_id\\s*=\\s*(AKIA|ASIA|A3T|AGPA|AIDA|AROA)[A-Z0-9]{12,}"

      - type: status
        status:
          - 200
